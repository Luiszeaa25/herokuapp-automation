name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run tests on ${{ matrix.browser }}
        env:
          BASEURL: https://the-internet.herokuapp.com/
          BROWSER: ${{ matrix.browser }}
          HEAD: "false"
          ENV: prod
        run: |
          npm run clean
          npm test || true

      - name: Add Allure environment and categories
        if: always()
        run: |
          mkdir -p allure-results
          cp src/helper/report/environment.properties allure-results/environment.properties
          cp src/helper/report/categories.json allure-results/categories.json
          echo "BROWSER=${{ matrix.browser }}" >> allure-results/environment.properties

      - name: Check allure-results exists
        if: always()
        run: |
          echo "Contents of allure-results:"
          ls -la allure-results/ || echo "allure-results/ is empty or does not exist"

      - name: Upload allure-results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.browser }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn

  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Download allure-results (chrome)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: allure-results/chrome

      - name: Download allure-results (firefox)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results/firefox

      - name: Download allure-results (webkit)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results-webkit
          path: allure-results/webkit

      - name: Restore Allure history
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1
          mkdir -p allure-results/merged/history
          git show origin/gh-pages:history 2>/dev/null | tar -x -C allure-results/merged/history || true
          echo "History restored (if available)"

      - name: Merge allure-results
        run: |
          mkdir -p allure-results/merged
          cp -r allure-results/chrome/. allure-results/merged/ 2>/dev/null || true
          cp -r allure-results/firefox/. allure-results/merged/ 2>/dev/null || true
          cp -r allure-results/webkit/. allure-results/merged/ 2>/dev/null || true
          echo "Merged allure-results:"
          ls -la allure-results/merged/

      - name: Generate Allure Report
        run: npx allure generate allure-results/merged --clean -o allure-report

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
